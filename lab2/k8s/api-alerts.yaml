apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: api-alerts
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: api.rules
      interval: 30s
      rules:
        - alert: ServiceDown
          expr: up{job="api"} == 0
          for: 2m 
          labels:
            severity: critical
            service: api
          annotations:
            summary: "Сервис api недоступен"
            description: "Prometheus не может скейпить дольше 2 минут. Сервис полностью упал"
        - alert: HighErrorRate
          expr: |
            sum(rate(api_errors_total[2m])) by (exported_endpoint)
            /
            sum(rate(api_requests_total[2m])) by (exported_endpoint)
            > 0.05
          for: 2m
          labels:
            severity: critical
            service: api 
          annotations:
            summary: "Высокая доля ошибок на {{ $labels.exported_endpoint }}"
            description: "Доля ошибок 5хх превышает 5% дольше 2 минут"
        - alert: HighLatency
          expr: |
            histogram_quantile(0.95,
              sum(rate(api_requests_duraction_seconds_bucket[2m])) by (le, exported_endpoint) 
            ) > 2
          for: 2m
          labels:
            severity: critical
            service: api 
          annotations:
            summary: "Высокое время ответа на {{ $labels.exported_endpoint }}"
            description: "95% запросов выполняется дольше 2 секунд на протяжении 2 минут"