apiVersion: v1
kind: Pod
metadata:
  name: good-with-resources
  namespace: default
  labels:
    app: test
spec:
  containers:
    - name: app
      image: shop-api:latest
      ports:
        - containerPort: 8080
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi