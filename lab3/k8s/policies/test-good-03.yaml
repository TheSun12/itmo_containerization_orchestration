apiVersion: v1
kind: Pod
metadata:
  name: good-with-labels
  namespace: default
  labels:
    app.kubernetes.io/name: shop-api
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/managed-by: helm
spec:
  containers:
    - name: app
      image: ghcr.io/prymitive/karma:v0.120
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi