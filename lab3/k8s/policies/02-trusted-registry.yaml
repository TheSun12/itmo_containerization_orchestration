apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: trusted-registry
  annotations:
    policies.kyverno.io/title: Trusted Container Registries Only
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      All container images must come from an approved set of trusted registries
spec:
  validationActions: [Deny]
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - cnpg-system
            - kyverno
            - monitoring
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        object.spec.containers.all(c, c.image.startsWith("docker.io/") || 
          c.image.startsWith("ghcr.io/") || c.image.startsWith("quay.io/") ||
          c.image.startsWith("registry.k8s.io/") || !c.image.contains("/"))
      message: "All container images must come from trusted registries: docker.io, ghcr.io, quay.io, registry.k8s.io"