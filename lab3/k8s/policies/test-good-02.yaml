apiVersion: v1
kind: Pod
metadata:
  name: good-trusted-registry
  namespace: default
  labels:
    app: test
spec:
  containers:
    - name: app
      image: ghcr.io/prymitive/karma:v0.120
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi