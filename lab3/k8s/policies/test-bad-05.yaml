apiVersion: v1
kind: Pod
metadata:
  name: bad-latest-tag
  namespace: default
  labels:
    app.kubernetes.io/name: bad-latest-tag
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/managed-by: kubectl
spec:
  containers:
    - name: app
      image: ghcr.io/prymitive/karma:latest
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi