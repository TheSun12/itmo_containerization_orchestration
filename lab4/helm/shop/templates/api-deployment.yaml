apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-api
  labels:
    {{- include "shop.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "shop.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      priorityClassName: {{ .Release.Name }}-critical
      {{- include "shop.spread" (dict "root" . "component" "api") | nindent 6 }}
      containers:
        - name: api
          image: "{{ .Values.image.registry }}/{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: SERVICE_NAME
              value: shop-api
            - name: DB_HOST
              value: {{ .Values.postgres.host | quote }}
            - name: DB_PORT
              value: {{ .Values.postgres.port | quote }}
            - name: DB_NAME
              value: {{ .Values.postgres.database | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: password 
            - name: HEALTH_FAIL
              value: {{ .Values.api.healthFail | default false | quote }}
            - name: STARTUP_DB_CHECK
              value: {{ .Values.api.startupDbCheck | quote }}
          readinessProbe:
            httpGet:
              path: {{ .Values.api.healthCheck.path }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ .Values.api.healthCheck.path }}
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}